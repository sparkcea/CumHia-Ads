<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Unlock Her Full Leak</title>
  <script src="https://telegram.org/js/telegram-web-app.js?61"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #0d0d0d;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .card {
      width: min(360px, 100%);
      padding: 36px 24px;
      border: 1px solid #bf5fff;
      border-radius: 20px;
      background: linear-gradient(145deg, #0a0a1a, #120a1f);
      box-shadow: 0 0 40px rgba(191, 95, 255, .18);
      text-align: center;
    }
    .icon { margin-bottom: 16px; font-size: 52px; }
    h1 { margin: 0 0 10px; font-size: 22px; line-height: 1.3; }
    .sub { margin: 0 0 28px; color: #bbb; font-size: 14px; line-height: 1.6; }
    .reward-badge {
      display: inline-block;
      margin-bottom: 28px;
      padding: 6px 16px;
      border: 1px solid rgba(191, 95, 255, .4);
      border-radius: 20px;
      background: rgba(191, 95, 255, .15);
      color: #bf5fff;
      font-size: 13px;
      font-weight: 600;
    }
    #adBtn {
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 16px;
      background: linear-gradient(135deg, #bf5fff, #7c00cc);
      color: #fff;
      cursor: pointer;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: .3px;
    }
    #adBtn:active { transform: scale(.97); }
    #adBtn:disabled { cursor: not-allowed; opacity: .5; }
    #status { min-height: 20px; margin-top: 18px; font-size: 14px; line-height: 1.45; }
    #status.success { color: #30d158; }
    #status.error { color: #ff453a; }
    #status.info { color: #ffd60a; }
    .note { margin: 24px 0 0; color: #777; font-size: 12px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon">🍑</div>
    <h1>Unlock Her Full Leak</h1>
    <p class="sub">Watch a quick video ad and the full uncensored leak lands in your chat.</p>
    <div class="reward-badge">Watch 1 Ad → Get Full Leak</div>
    <button id="adBtn" type="button">Watch Ad to Unlock</button>
    <div id="status" aria-live="polite"></div>
    <p class="note">Ad powered by Adsgram</p>
  </main>

  <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
  <script>
    const CURRENT_SUPABASE_URL = 'https://nnwfpiornakeldkycxwh.supabase.co';
    const CURRENT_SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ud2ZwaW9ybmFrZWxka3ljeHdoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0NjU5NzEsImV4cCI6MjEwMjA0MTk3MX0.DAKbe7XS37RIqQ_AbPnm0Z9L5C47cDbZx76pr7p7LrY';
    const AD_BLOCK_ID = '37388';

    const tg = window.Telegram && window.Telegram.WebApp;
    const btn = document.getElementById('adBtn');
    const status = document.getElementById('status');
    const setStatus = (kind, message) => { status.className = kind; status.textContent = message; };

    if (tg) {
      tg.ready();
      tg.expand();
      tg.setHeaderColor('#0d0d0d');
      tg.setBackgroundColor('#0d0d0d');
    }

    const adController = window.Adsgram ? window.Adsgram.init({ blockId: AD_BLOCK_ID, debug: false }) : null;

    async function queueVerifiedReward() {
      if (!tg || !tg.initData) {
        throw new Error('Open this reward page from the CumHia Telegram bot.');
      }
      const response = await fetch(`${CURRENT_SUPABASE_URL}/functions/v1/miniapp-api`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'apikey': CURRENT_SUPABASE_ANON_KEY,
          'Authorization': `Bearer ${CURRENT_SUPABASE_ANON_KEY}`
        },
        body: JSON.stringify({
          route: 'record-ad-reward',
          init_data: tg.initData,
          content_type: 'leaks'
        })
      });
      const body = await response.json().catch(() => ({}));
      if (!response.ok || !body.queued) {
        throw new Error(body.error || 'Could not queue the reward. Please try again.');
      }
      return body;
    }

    async function watchAd() {
      if (!adController) {
        setStatus('error', 'The ad service is not ready. Please close and reopen this page.');
        return;
      }
      if (!tg || !tg.initData) {
        setStatus('error', 'Open this reward page from the CumHia Telegram bot.');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Loading Ad…';
      setStatus('', '');
      try {
        const result = await adController.show();
        if (!result || !result.done) {
          btn.disabled = false;
          btn.textContent = 'Watch Ad to Unlock';
          setStatus('error', 'Please watch the full ad to unlock your reward.');
          return;
        }

        setStatus('info', 'Ad completed. Saving your reward…');
        const queued = await queueVerifiedReward();
        setStatus('success', queued.already_queued
          ? 'Reward already queued. Return to the chat and tap Done.'
          : 'Reward queued. Return to the chat and tap Done.');
        btn.textContent = 'Reward Queued';
        setTimeout(() => tg.close(), 1200);
      } catch (error) {
        console.warn('Adsgram reward error:', error);
        btn.disabled = false;
        btn.textContent = 'Watch Ad to Unlock';
        setStatus('error', error && error.message ? error.message : 'The ad reward could not be saved. Please try again.');
      }
    }

    btn.addEventListener('click', watchAd);
  </script>
</body>
</html>
